# config.yaml 로 복사해서 사용 (config.yaml 은 .gitignore 대상)
aosp_root: aosp/frameworks/base
output_root: output
rules_dir: rules
baselines_dir: baselines

llm:
  provider: ""          # 팀 결정 후 기입 (예: anthropic, openai)
  model: ""
  temperature: 0.0
  api_key_env: LLM_API_KEY   # 키 값이 아니라 환경변수 "이름". 키는 export LLM_API_KEY=... 로만 전달

device:
  kind: cuttlefish      # 2주차 성공 기준 미달 시 emulator
  vulnerable_image: ""
  patched_image: ""
  snapshot: clean
  boot_timeout_sec: 300
