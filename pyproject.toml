[project]
name = "aosp1day"
version = "0.0.1"
description = "AOSP Framework/system_server 1-Day 패치 기반 재현·원인 분석 자동화 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",           # config.yaml
    "streamlit>=1.40",       # M10 대시보드
]

[project.optional-dependencies]
# 특정 단계에서만 필요한 패키지: pip install -e ".[analysis]"
analysis = [
    "tree-sitter>=0.23",     # M2/M3 구문 분석, M5/M6 규칙 엔진 (Tree-sitter Query + matcher)
    "tree-sitter-java>=0.23",
]
# M4 LLM provider SDK 는 llm.LlmClient 구현체를 추가할 때 여기에 넣는다 (예: llm-anthropic = [...])
llm = []
dev = [
    "pytest>=8",
]

[project.scripts]
aosp1day = "aosp1day.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aosp1day"]
