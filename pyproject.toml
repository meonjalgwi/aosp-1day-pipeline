[project]
name = "aosp1day"
version = "0.0.1"
description = "AOSP Framework/system_server 1-Day 패치 기반 재현·원인 분석 자동화 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # skeleton 단계에서는 표준 라이브러리만 사용. 구현 시 아래를 활성화한다.
    # "tree-sitter",         # M2/M3 구문 분석, M5/M6 규칙 엔진 (Tree-sitter Query + matcher)
    # "tree-sitter-java",
    # <LLM provider SDK>,    # M4 — llm.LlmClient 구현체에서만 import
    # "pyyaml",              # config.yaml
    # "streamlit",           # M10 대시보드
]

[project.scripts]
aosp1day = "aosp1day.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aosp1day"]
